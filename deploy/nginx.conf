# Панель наружу только через TLS. Без этого не выставляйте её в интернет:
# юзербот работает на полном доступе к аккаунту владельца.
#
#   certbot --nginx -d rate.example.com
#
server {
    listen 443 ssl http2;
    server_name rate.example.com;

    ssl_certificate     /etc/letsencrypt/live/rate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rate.example.com/privkey.pem;

    # Дополнительный слой поверх PANEL_TOKEN.
    # htpasswd -c /etc/nginx/.htpasswd-tgrate имя
    auth_basic "Панель";
    auth_basic_user_file /etc/nginx/.htpasswd-tgrate;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name rate.example.com;
    return 301 https://$host$request_uri;
}
